name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: UniverLab/workflows/.github/workflows/rust-release.yml@main
    with:
      binary-name: canopy
      system-packages: protobuf-compiler
      # LanceDB's lance-encoding builds protobuf definitions, so protoc has to
      # exist on every target — not just the Linux ones. Different name here
      # because brew calls the package protobuf, not protobuf-compiler.
      system-packages-brew: protobuf
      include-windows: false
    secrets: inherit
